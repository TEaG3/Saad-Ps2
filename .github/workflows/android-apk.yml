name: Build Saad PS2 Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'saf-storage-bridge.bundle.js'
      - 'game-database.js'
      - 'database/**'
      - 'android-native/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon.svg saf-storage-bridge.bundle.js game-database.js www/
          mkdir -p www/database
          cp database/manifest.json database/catalog.json www/database/
      - name: Bundle native plugin proxy
        run: npx esbuild android-native/saf-storage-bridge.js --bundle --format=iife --outfile=www/saf-storage-bridge.bundle.js
      - name: Generate Android project
        run: npx cap add android
      - name: Generate Saad PS2 launcher icon
        run: |
          pip install --quiet pillow
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          def make_icon(size, transparent=False):
              im = Image.new('RGBA',(size,size),(0,0,0,0) if transparent else (15,23,42,255))
              d = ImageDraw.Draw(im)
              pad = int(size*.06)
              box=(pad,pad,size-pad,size-pad)
              radius=int(size*.23)
              for y in range(pad,size-pad):
                  t=(y-pad)/max(1,size-2*pad)
                  c=(int(40*(1-t)+8*t),int(103*(1-t)+201*t),int(255*(1-t)+239*t),255)
                  d.line((pad,y,size-pad,y),fill=c)
              mask=Image.new('L',(size,size),0); md=ImageDraw.Draw(mask); md.rounded_rectangle(box,radius=radius,fill=255)
              im.putalpha(mask)
              draw=ImageDraw.Draw(im)
              try: font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',int(size*.29))
              except: font=ImageFont.load_default()
              text='PS2'; bb=draw.textbbox((0,0),text,font=font,stroke_width=0)
              x=(size-(bb[2]-bb[0]))/2; y=(size-(bb[3]-bb[1]))/2-bb[1]
              draw.text((x,y),text,font=font,fill='white')
              return im
          for density,size in sizes.items():
              make_icon(size).save(f'android/app/src/main/res/mipmap-{density}/ic_launcher.png')
              make_icon(size).save(f'android/app/src/main/res/mipmap-{density}/ic_launcher_round.png')
          make_icon(432,True).save('android/app/src/main/res/drawable/ic_launcher_foreground.png')
          PY
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <resources><color name="ic_launcher_background">#10234A</color></resources>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Install native SAF bridge
        run: |
          mkdir -p android/app/src/main/java/com/saadps2/artwork
          rm -f android/app/src/main/java/com/saadps2/artwork/MainActivity.java
          cp android-native/MainActivity.java android/app/src/main/java/com/saadps2/artwork/MainActivity.java
          cp android-native/SafStoragePlugin.java android/app/src/main/java/com/saadps2/artwork/SafStoragePlugin.java
          printf '\ndependencies {\n    implementation "androidx.documentfile:documentfile:1.0.1"\n}\n' >> android/app/build.gradle
      - name: Set Android version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$(node -e "const p=process.argv[1].split('.').map(Number); console.log(p[0]*10000+p[1]*100+p[2])" "$VERSION")
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/; s/versionName \"[^\"]+\"/versionName \"$VERSION\"/" android/app/build.gradle
          echo "Building Saad PS2 $VERSION (code $VERSION_CODE)"
      - name: Sync web assets
        run: npx cap sync android
      - name: Build installable Android APKs
        working-directory: android
        run: |
          # Release variant is optimized but signed with Android's temporary debug key
          # so it can be installed directly for device testing. A private upload key
          # is required later for Play Store publication and trusted app updates.
          cat >> app/build.gradle <<'EOF'
          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF
          ./gradlew assembleDebug assembleRelease
      - uses: actions/upload-artifact@v6
        with:
          name: saad-ps2-android-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK on project download page
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-latest
          name: Saad PS2 - Latest Android APK
          body: |
            أحدث نسخة Android من Saad PS2.
            يتضمن APK تجريبياً ونسخة Release محسّنة وموقعة بمفتاح Android debug لتثبيتها مباشرة.
            هذا ليس مفتاح نشر Play Store؛ يلزم مفتاح توقيع خاص للمداومة على التحديثات والنشر الرسمي.
          prerelease: true
          make_latest: false
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          overwrite_files: true
