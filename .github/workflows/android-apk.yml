name: Build Saad PS2 Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'saf-storage-bridge.bundle.js'
      - 'game-database.js'
      - 'game-id-parser.js'
      - 'tests/**'
      - 'database/**'
      - 'android-native/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Run game ID parser tests
        run: npm test
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon.svg saf-storage-bridge.bundle.js game-database.js game-id-parser.js www/
          mkdir -p www/database
          cp database/manifest.json database/catalog.json www/database/
      - name: Bundle native plugin proxy
        run: npx esbuild android-native/saf-storage-bridge.js --bundle --format=iife --outfile=www/saf-storage-bridge.bundle.js
      - name: Generate Android project
        run: npx cap add android
      - name: Install native SAF bridge
        run: |
          mkdir -p android/app/src/main/java/com/saadps2/artwork
          rm -f android/app/src/main/java/com/saadps2/artwork/MainActivity.java
          cp android-native/MainActivity.java android/app/src/main/java/com/saadps2/artwork/MainActivity.java
          cp android-native/SafStoragePlugin.java android/app/src/main/java/com/saadps2/artwork/SafStoragePlugin.java
          printf '\ndependencies {\n    implementation "androidx.documentfile:documentfile:1.0.1"\n}\n' >> android/app/build.gradle
      - name: Set Android version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$(node -e "const p=process.argv[1].split('.').map(Number); console.log(p[0]*10000+p[1]*100+p[2])" "$VERSION")
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/; s/versionName \"[^\"]+\"/versionName \"$VERSION\"/" android/app/build.gradle
          echo "Building Saad PS2 $VERSION (code $VERSION_CODE)"
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: saad-ps2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK on project download page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Saad PS2 - Latest Android APK
          body: |
            أحدث نسخة Android من Saad PS2.
            يتم تحديث هذا الإصدار تلقائياً عند نجاح بناء APK جديد.
          prerelease: true
          make_latest: false
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          overwrite_files: true
