name: Build Saad PS2 Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'android-native/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon.svg saf-storage-bridge.bundle.js www/
      - name: Bundle native plugin proxy
        run: npx esbuild android-native/saf-storage-bridge.js --bundle --format=iife --outfile=www/saf-storage-bridge.bundle.js
      - name: Generate Android project
        run: npx cap add android
      - name: Install native SAF bridge
        run: |
          mkdir -p android/app/src/main/java/com/saadps2/artwork
          rm -f android/app/src/main/java/com/saadps2/artwork/MainActivity.java
          cp android-native/MainActivity.java android/app/src/main/java/com/saadps2/artwork/MainActivity.java
          cp android-native/SafStoragePlugin.java android/app/src/main/java/com/saadps2/artwork/SafStoragePlugin.java
          printf '\ndependencies {\n    implementation "androidx.documentfile:documentfile:1.0.1"\n}\n' >> android/app/build.gradle
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: saad-ps2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
