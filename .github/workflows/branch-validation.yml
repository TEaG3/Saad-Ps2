name: Saad PS2 Branch Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - ux/audit-and-mobile-refresh
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'package-lock.json'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'saf-storage-bridge.bundle.js'
      - 'game-database.js'
      - 'database/**'
      - 'android-native/**'
      - '.github/workflows/branch-validation.yml'

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install isolated IndexedDB test dependency
        run: npm install --no-save --package-lock=false fake-indexeddb@6

      - name: Validate web source and database behavior
        run: |
          npm run check
          npm run test:db

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html styles.css app.js manifest.webmanifest sw.js icon.svg saf-storage-bridge.bundle.js game-database.js www/
          mkdir -p www/database
          cp database/manifest.json database/catalog.json www/database/

      - name: Bundle Android SAF bridge
        run: npx esbuild android-native/saf-storage-bridge.js --bundle --format=iife --outfile=www/saf-storage-bridge.bundle.js

      - name: Generate Android project
        run: npx cap add android

      - name: Install native SAF plugin
        run: |
          mkdir -p android/app/src/main/java/com/saadps2/artwork
          rm -f android/app/src/main/java/com/saadps2/artwork/MainActivity.java
          cp android-native/MainActivity.java android/app/src/main/java/com/saadps2/artwork/MainActivity.java
          cp android-native/SafStoragePlugin.java android/app/src/main/java/com/saadps2/artwork/SafStoragePlugin.java
          printf '\ndependencies {\n    implementation "androidx.documentfile:documentfile:1.0.1"\n}\n' >> android/app/build.gradle

      - name: Set Android version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VERSION_CODE=$(node -e "const p=process.argv[1].split('.').map(Number); console.log(p[0]*10000+p[1]*100+p[2])" "$VERSION")
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/; s/versionName \"[^\"]+\"/versionName \"$VERSION\"/" android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload validation APK (no release publication)
        uses: actions/upload-artifact@v6
        with:
          name: saad-ps2-branch-validation-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
